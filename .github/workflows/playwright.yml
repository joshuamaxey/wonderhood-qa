name: Playwright Smoke Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      DEFAULT_PASS: ${{ secrets.DEFAULT_PASS }}
      TEST_USER1: ${{ secrets.TEST_USER1 }}
      TEST_USER1_PASS: ${{ secrets.TEST_USER1_PASS }}
      SIGNUP_USER1_FIRSTNAME: ${{ secrets.SIGNUP_USER1_FIRSTNAME }}
      SIGNUP_USER1_LASTNAME: ${{ secrets.SIGNUP_USER1_LASTNAME }}
      SIGNUP_USER1_EMAIL: ${{ secrets.SIGNUP_USER1_EMAIL }}
      SIGNUP_USER1_PHONE: ${{ secrets.SIGNUP_USER1_PHONE }}
      SIGNUP_USER1_PASS: ${{ secrets.SIGNUP_USER1_PASS }}
      SIGNUP_USER1_ADDRESS: ${{ secrets.SIGNUP_USER1_ADDRESS }}
      SIGNUP_USER1_CITY: ${{ secrets.SIGNUP_USER1_CITY }}
      SIGNUP_USER1_STATE: ${{ secrets.SIGNUP_USER1_STATE }}
      SIGNUP_USER1_ZIP: ${{ secrets.SIGNUP_USER1_ZIP }}
      ADD_CHILD_USER_EMAIL: ${{ secrets.ADD_CHILD_USER_EMAIL }}
      ADD_CHILD_USER_PASSWORD: ${{ secrets.ADD_CHILD_USER_PASSWORD }}
      ADD_CHILD_CHILD_FIRST_NAME: ${{ secrets.ADD_CHILD_CHILD_FIRST_NAME }}
      ADD_CHILD_CHILD_LAST_NAME: ${{ secrets.ADD_CHILD_CHILD_LAST_NAME }}
      ADD_CHILD_CHILD_PREFERRED_NAME: ${{ secrets.ADD_CHILD_CHILD_PREFERRED_NAME }}
      ADD_CHILD_CHILD_BIRTHDAY: ${{ secrets.ADD_CHILD_CHILD_BIRTHDAY }}
      ADD_CHILD_CHILD_GRADE: ${{ secrets.ADD_CHILD_CHILD_GRADE }}
      ADD_CHILD_CHILD_MEDICAL_NOTES: ${{ secrets.ADD_CHILD_CHILD_MEDICAL_NOTES }}
      ADD_CHILD_CHILD_ADDITIONAL_NOTES: ${{ secrets.ADD_CHILD_CHILD_ADDITIONAL_NOTES }}
      ADD_CHILD_EMERGENCY_CONTACT_FIRST_NAME: ${{ secrets.ADD_CHILD_EMERGENCY_CONTACT_FIRST_NAME }}
      ADD_CHILD_EMERGENCY_CONTACT_LAST_NAME: ${{ secrets.ADD_CHILD_EMERGENCY_CONTACT_LAST_NAME }}
      ADD_CHILD_EMERGENCY_CONTACT_RELATIONSHIP: ${{ secrets.ADD_CHILD_EMERGENCY_CONTACT_RELATIONSHIP }}
      ADD_CHILD_EMERGENCY_CONTACT_PHONE: ${{ secrets.ADD_CHILD_EMERGENCY_CONTACT_PHONE }}
      ADD_CHILD_WAIVER_SIGNATURE_NAME: ${{ secrets.ADD_CHILD_WAIVER_SIGNATURE_NAME }}
      EVENT_REGISTRATION_USER_EMAIL: ${{ secrets.EVENT_REGISTRATION_USER_EMAIL }}
      EVENT_REGISTRATION_USER_PASSWORD: ${{ secrets.EVENT_REGISTRATION_USER_PASSWORD }}
      EVENT_EDIT_ADMIN_EMAIL: ${{ secrets.EVENT_EDIT_ADMIN_EMAIL }}
      EVENT_EDIT_ADMIN_PASSWORD: ${{ secrets.EVENT_EDIT_ADMIN_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Verify BASE_URL is configured
      run: test -n "$BASE_URL"
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright smoke tests
      run: npx playwright test Flows/smoke
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
